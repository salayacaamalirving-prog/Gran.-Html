<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;900&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#07061a;--panel:#1a1745;--blue:#2e8cf2;--gold:#ffd93d;--red:#ff5a4a;--green:#4ade80;--muted:#9ba6dc;--px:'Press Start 2P','Courier New',monospace;--ui:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#eef1ff;font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;transform-origin:center;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:none}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;gap:22px;padding:60px 48px;background:radial-gradient(circle at 50% 0,#262270,#07061a 70%);overflow-y:auto}
.scr.on{display:flex}#end.on{background:#02011099;justify-content:center}
h1,.h2,.px{font-family:var(--px);margin:0;text-align:center;line-height:1.3}
h1{font-size:48px;text-shadow:0 6px 0 #0a1a6e,0 0 30px #6a5cff}.h2{font-size:36px}.px{font-size:20px}
.gold{color:var(--gold)}.red{color:var(--red)}.muted{color:var(--muted);font-weight:700;font-size:24px;text-align:center}
input{width:100%;padding:22px;font:900 32px var(--ui);text-align:center;border-radius:14px;border:3px solid #3a3a8a;background:#0d0b30;color:#fff}
.btn{width:100%;padding:24px;font:900 32px var(--ui);border:0;border-radius:14px;color:#fff;background:var(--blue);box-shadow:0 8px 0 #1b64c4}
.btn.green{background:#2fb35f;box-shadow:0 8px 0 #1c7a3f}.btn.red{background:#d9453a;box-shadow:0 8px 0 #912a22}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #0006}.btn:disabled{opacity:.45}
.row{display:flex;gap:14px;width:100%}.row>*{flex:1}
.chip{padding:18px;font:900 26px var(--ui);border-radius:12px;border:3px solid #3a3a8a;background:#0d0b30;color:var(--muted)}.chip.on{background:var(--blue);color:#fff;border-color:#8cc8ff}
.box{width:100%;background:var(--panel);border:3px solid #2c2880;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.lrow{display:flex;justify-content:space-between;align-items:center;font:900 28px var(--ui);padding:6px 0}.lrow.me{color:var(--gold)}
.tag{font:900 20px var(--ui);padding:6px 14px;border-radius:99px;background:#3a3a8a}.tag.ok{background:#2fb35f}.tag.ex{background:#d9453a}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;border:2px solid var(--gold);padding:16px 26px;border-radius:12px;font:900 26px var(--ui);display:none;z-index:9;text-align:center;max-width:90%}
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#cd{position:absolute;top:36%;width:100%;text-align:center;font:72px var(--px);color:#fff;text-shadow:0 6px 0 #000;white-space:pre-line}
#board{position:absolute;right:24px;top:20px;text-align:right;font:900 24px var(--ui);text-shadow:0 2px 4px #000}
#quit{position:absolute;left:50%;top:14px;transform:translateX(-50%);pointer-events:auto;background:#0008;color:#fff;border:2px solid #fff6;border-radius:10px;padding:8px 18px;font:900 22px var(--ui)}
#chatb{position:absolute;left:14px;top:12px;pointer-events:auto;background:#000a;color:#fff;border:2px solid #fff6;border-radius:12px;padding:6px 16px;font-size:30px}
#chatb.dead{border-color:var(--gold);animation:pl 1s infinite alternate}@keyframes pl{to{box-shadow:0 0 16px var(--gold)}}
#chatbox{display:none;position:absolute;left:14px;right:14px;top:70px;gap:10px;pointer-events:auto}
#chatbox input{padding:12px;font-size:26px;text-align:left}#chatbox button{width:84px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:30px}
#msgs{position:absolute;left:14px;top:150px;width:64%;display:flex;flex-direction:column;gap:6px;font:900 24px var(--ui);text-shadow:0 2px 4px #000}
#msgs div{background:#000b;padding:6px 12px;border-radius:10px;word-break:break-word}
#skins{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.sk{width:58px;height:58px;border-radius:14px;border:4px solid #3a3a8a;color:#fff;font:900 14px var(--ui);padding:0}.sk.on{border-color:#fff}
</style></head><body>
<div id="stage">
<div class="scr on" id="s-login" style="justify-content:center"><h1>ONLINE</h1><div class="muted">Entra con tu cuenta del juego</div>
<input id="n" placeholder="Nombre" maxlength="12"><input id="p" type="password" placeholder="Contraseña">
<button class="btn" data-a="login">ENTRAR</button></div>

<div class="scr" id="s-menu"><h1>ONLINE</h1><div class="h2 gold" id="hi"></div>
<div class="box"><div class="px">TU PIEL</div><div id="skins"></div><div class="muted" id="skinNote" style="font-size:20px"></div></div>
<div class="box"><div class="px">CREAR SALA</div><div class="row"><button class="chip on" data-a="m0">NORMAL</button><button class="chip" data-a="m1">EXTREMO</button></div><button class="btn green" data-a="create">CREAR SALA</button></div>
<div class="box"><div class="px">UNIRSE CON CÓDIGO</div><input id="code" inputmode="numeric" maxlength="4" placeholder="0000" style="letter-spacing:.25em"><button class="btn" data-a="join">UNIRSE</button></div>
<button class="btn red" data-a="logout" style="font-size:24px;padding:16px">CERRAR SESIÓN</button></div>

<div class="scr" id="s-room"></div>
<canvas id="cv" width="720" height="1280"></canvas>
<div id="hud"><div id="cd"></div><div id="board"></div><button id="quit" data-a="quit">SALIR</button><button id="chatb" data-a="chat">💬</button><div id="chatbox"><input id="chatin" maxlength="80" placeholder="Escribe un mensaje…" autocomplete="off"><button data-a="send">➤</button></div><div id="msgs"></div></div>
<div class="scr" id="end"></div><div id="toast"></div>
</div>

/* ---------- Texturas mejoradas (se dibujan en alta resolución al cargar) ---------- */
function mk(w,h,f){const c=document.createElement("canvas");c.width=w;c.height=h;f(c.getContext("2d"),w,h);return c}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function shade(hex,a){const n=parseInt(hex.slice(1),16),f=v=>clamp(Math.round(a<0?v*(1+a):v+(255-v)*a),0,255);return"rgb("+f(n>>16)+","+f(n>>8&255)+","+f(n&255)+")"}
const PAT=["..oooooooooooo..", ".ollllllllllllo.", "ollllllllllllllo", "olaaaaaaaaaaaado", "olaaaaaaaaaaaado", "olaawkaaaawkaado", "olaakkaaaakkaado", "olaakkaaaakkaado", "olaakkaaaakkaado", "olaaaaaaaaaaaado", "olaaaaaaaaaaaado", "oaaaaaaaaaaaaddo", "oddddddddddddddo", ".oddddddddddddo.", "..oooooooooooo..", "................"];
function cubeTex(col){const P={o:shade(col,-.6),l:shade(col,.6),a:col,d:shade(col,-.35),k:"#0b1030",w:"#fff"};return mk(16,16,g=>{PAT.forEach((row,y)=>{for(let x=0;x<16;x++){const c=P[row[x]];if(c){g.fillStyle=c;g.fillRect(x,y,1,1)}}})})}
function pxc(n,f){return mk(n,n,g=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=f(x+.5,y+.5);if(c){g.fillStyle=c;g.fillRect(x,y,1,1)}}})}
function buildTex(){ctx.imageSmoothingEnabled=false;
 IM.player=cubeTex("#4fc3ff");
 IM.proj=pxc(16,(x,y)=>{const d=Math.hypot(x-10,y-8);if(d<2.2)return"#fff";if(d<3.6)return"#ffe04a";if(d<5)return"#ff8a1a";if(d<6)return"#c4321a";if(x<10&&Math.abs(y-8)<x/10*4&&((x|0)+(y|0)&1||x>5))return x>6?"#ff9a2a":"#c4321a";return""});
 IM.laser=mk(64,12,g=>{const C=[0,"#a00","#e22","#ff5a4a","#ffb0a0","#fff","#fff","#ffb0a0","#ff5a4a","#e22","#a00",0];for(let y=0;y<12;y++)for(let x=0;x<64;x++){let c=C[y];if(!c)continue;if(y===3||y===8)c=(x>>2&1)?"#ff5a4a":"#ff8a7a";if((y===5||y===6)&&x%8===0)c="#ffe0d8";g.fillStyle=c;g.fillRect(x,y,1,1)}});
 IM.warn=pxc(16,(x,y)=>{const h=(y-1)*.5,a=Math.abs(x-8);if(y<1||y>14.5||a>h)return"";if(x>7&&x<9&&y>4.9&&y<10||x>7&&x<9&&y>11&&y<13)return"#fff";if(a>h-1.2||y>13.4)return"#fff";return y<8?"#ff7a4a":"#e8392b"});
 IM.target=pxc(16,(x,y)=>{const d=Math.hypot(x-8,y-8);if(d>6.2&&d<7.7||d>3.4&&d<4.8||d<1.6)return"#ffb333";if((Math.abs(x-8)<.8||Math.abs(y-8)<.8)&&d>4.8&&d<7.9)return"#ffb333";return""});
 IM.bg=mk(130,224,(g,w,h)=>{const r=mulberry32(7),B=[[.2,.25,.4,[90,70,255]],[.85,.6,.45,[40,140,255]],[.3,.9,.35,[200,70,200]]];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=Math.abs(y/h-.5)*2;let c=[10+6*(1-k),9+5*(1-k),48+30*(1-k)];
   for(const[bx,by,rad,col]of B){const a=Math.floor(Math.max(0,1-Math.hypot(x-bx*w,y-by*h)/(rad*h))*4)/4*.3;c=c.map((v,i)=>v+col[i]*a)}
   if(x%15===0||y%15===0)c=c.map(v=>v+10);g.fillStyle="rgb("+c.map(v=>clamp(v|0,0,255))+")";g.fillRect(x,y,1,1)}
  for(let i=0;i<70;i++){g.fillStyle=r()<.2?"#fff":"#8c94d8";g.fillRect(r()*w|0,r()*h|0,1,1)}})}

/* ---------- Piel: la del juego (si se encuentra), o la que elijas aquí. Se comparte con los demás jugadores ---------- */
const SKK="esq_online_skin",SKC=["#4fc3ff","#ff5a7a","#4ade80","#ffd93d","#b07cff","#ff9a3c"],ST={};
const okSkin=s=>typeof s==="string"&&s.length<40000&&(/^c:#[0-9a-f]{6}$/i.test(s)||/^data:image\/(png|jpeg|webp|gif);base64,[\w+\/=]+$/.test(s))?s:"";
const lsGet=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};
function findSkin(x){if(typeof x==="string")return/^#[0-9a-f]{6}$/i.test(x)?"c:"+x:okSkin(x);if(x&&typeof x==="object")for(const y of Object.values(x)){const r=findSkin(y);if(r)return r}return""}
function detectSkin(){const q=new URLSearchParams(location.search).get("skin");if(q)return okSkin(q)||(/^#[0-9a-f]{6}$/i.test(q)?"c:"+q:"");
 try{for(const k of Object.keys(localStorage)){if(k===SKK||!/skin|piel|equip|avatar|person|char/i.test(k))continue;const v=lsGet(k);let r=findSkin(v);if(!r)try{r=findSkin(JSON.parse(v))}catch(e){}if(r)return r}}catch(e){}return""}
function mySkin(){return okSkin(lsGet(SKK))||detectSkin()||"c:"+SKC[0]}
function skinOf(id){return(roster.find(r=>r.id===id)||{}).skin||""}
function skinTex(s){if(!s)return IM.player;let t=ST[s];if(!t){if(s[0]==="c")t=ST[s]=cubeTex(s.slice(2));else{t=ST[s]=new Image();t.onload=()=>{if($("#skins").children.length)renderSkins()};t.src=s}}return t.complete===false||t.naturalWidth===0?IM.player:t}
function setSkin(c){try{c?localStorage.setItem(SKK,"c:"+c):localStorage.removeItem(SKK)}catch(e){}renderSkins()}
function renderSkins(){const el=$("#skins"),own=lsGet(SKK),pv=document.createElement("canvas");pv.width=pv.height=64;const pg=pv.getContext("2d");pg.imageSmoothingEnabled=false;pg.drawImage(skinTex(mySkin()),0,0,64,64);el.innerHTML="";el.append(pv);
 const a=document.createElement("button");a.className="sk"+(own?"":" on");a.dataset.a="sk";a.dataset.c="";a.textContent="AUTO";a.style.background="#1a1745";el.append(a);
 for(const c of SKC){const b=document.createElement("button");b.className="sk"+(own==="c:"+c?" on":"");b.dataset.a="sk";b.dataset.c=c;b.style.background=c;el.append(b)}
 $("#skinNote").textContent=own?"Piel elegida aquí":detectSkin()?"Usando la piel que tienes puesta en el juego":"No encontré tu piel del juego: elige una"}

/* ---------- Red: WebRTC (PeerJS). Posiciones por canal SIN espera (unreliable) = menos lag ---------- */
let peer,isHost=false,code="",mode=0,state="menu",hostId="",roster=[],conns={},pconns={},hostC=null,hostP=null,G=null,endRows=null;
const send=(c,m)=>{try{c&&c.open&&c.send(m)}catch(e){}};
const broadcast=(m,ex)=>{for(const k in conns)if(k!==ex)send(conns[k],m)};
const nameOf=id=>(roster.find(r=>r.id===id)||(G&&G.names[id]?{name:G.names[id]}:{name:"…"})).name;
function leaveAll(msg){try{peer&&peer.destroy()}catch(e){}peer=null;isHost=false;conns={};pconns={};hostC=hostP=null;roster=[];G=null;endRows=null;state="menu";chatClear();show("menu");if(msg)toast(msg)}
function createRoom(){let n=0;(function t(){code=String(1000+Math.random()*9000|0);peer=new Peer("esquiva-"+code);
 peer.on("error",e=>{if(e.type==="unavailable-id"&&n++<6){peer.destroy();t()}else toast("Error de red: "+e.type)});
 peer.on("open",id=>{isHost=true;me.id=hostId=id;state="room";roster=[{id,name:me.name,ready:false,skin:mySkin()}];show("room");renderRoom()});
 peer.on("connection",c=>{
  if(c.metadata&&c.metadata.k==="pos"){pconns[c.peer]=c;c.on("data",d=>{d.id=c.peer;for(const k in pconns)if(k!==c.peer)send(pconns[k],d);applyPos(c.peer,d)});return}
  c.on("open",()=>{if(roster.length>=4||state==="playing"){send(c,{t:"full",why:state==="playing"?"La partida ya empezó":"Sala llena"});setTimeout(()=>c.close(),400);return}conns[c.peer]=c});
  c.on("data",d=>hostMsg(c.peer,d));c.on("close",()=>drop(c.peer))})})()}
function hostMsg(id,d){if(d.t==="hello"){if(roster.some(r=>r.id===id))return;roster.push({id,name:String(d.name).slice(0,12),ready:state==="end",skin:okSkin(d.skin)});sendRoster()}
 else if(d.t==="again"){const r=roster.find(x=>x.id===id);if(r){r.ready=!!d.v;sendRoster()}}
 else if(d.t==="dead")markDead(id,+d.time||0);
  else if(d.t==="chat"){const t=String(d.m||"").trim().slice(0,80);if(t&&G&&G.dead[id]!==undefined){addMsg(id,t);broadcast({t:"chat",id,m:t})}}}
function drop(id){delete conns[id];delete pconns[id];roster=roster.filter(r=>r.id!==id);if(G&&!G.over)markDead(id,G.t);sendRoster()}
function sendRoster(){broadcast({t:"roster",list:roster,mode,state,hostId});renderRoom();renderEnd();
 if(isHost&&state==="end"&&roster.length>=2&&roster.every(r=>r.ready))setTimeout(()=>{if(state==="end"&&roster.length>=2&&roster.every(r=>r.ready))hostStart()},900)}
function joinRoom(c){peer=new Peer();let ok=false;setTimeout(()=>{if(!ok){toast("No se pudo entrar a la sala");leaveAll()}},8000);
 peer.on("error",e=>{toast(e.type==="peer-unavailable"?"Esa sala no existe":"Error de red: "+e.type);if(!ok)leaveAll()});
 peer.on("open",id=>{me.id=id;hostId="esquiva-"+c;code=c;
  hostC=peer.connect(hostId,{reliable:true});hostP=peer.connect(hostId,{reliable:false,metadata:{k:"pos"}});
  hostC.on("open",()=>{ok=true;send(hostC,{t:"hello",name:me.name,skin:mySkin()})});hostC.on("data",clientMsg);
  hostC.on("close",()=>leaveAll("El anfitrión cerró la sala"));hostP.on("data",d=>applyPos(d.id,d))})}
function clientMsg(d){if(d.t==="roster"){roster=d.list;mode=d.mode;state=d.state;if(!G||G.over){if(state==="room"){show("room")}}renderRoom();renderEnd()}
 else if(d.t==="full")leaveAll(d.why);else if(d.t==="go")startGame(d);else if(d.t==="chat")addMsg(d.id,String(d.m||"").slice(0,80));
 else if(d.t==="dead")markDead(d.id,d.time);else if(d.t==="end"){if(G)G.over=true;showEnd(d.rows)}}

/* ---------- Entrada (igual que el juego: mouse absoluto, dedo relativo) ---------- */
const Input={mouse:false,mx:W/2,my:H/2,drag:[0,0],last:new Map()};
const toArena=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};
cv.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"){Input.mouse=false;Input.last.set(e.pointerId,[e.clientX,e.clientY]);try{cv.setPointerCapture(e.pointerId)}catch(_){}}});
cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();
 if(e.pointerType==="mouse"||e.pointerType==="pen"){Input.mouse=true;[Input.mx,Input.my]=toArena(e)}
 else{const l=Input.last.get(e.pointerId)||[e.clientX,e.clientY];Input.drag[0]+=(e.clientX-l[0])/r.width*W*1.8;Input.drag[1]+=(e.clientY-l[1])/r.height*H*1.8;Input.last.set(e.pointerId,[e.clientX,e.clientY]);Input.mouse=false}});
const endP=e=>Input.last.delete(e.pointerId);cv.addEventListener("pointerup",endP);cv.addEventListener("pointercancel",endP);

/* ---------- Jugabilidad (portada de ESQUIVA_LISTO.html) ---------- */
class Player{constructor(x,y){this.x=this.tx=x;this.y=this.ty=y;this.vx=0;this.rot=0;this.flapT=0;this.flap=0;this.hit=19;Input.mx=x;Input.my=y;Input.drag=[0,0]}
 update(dt){const dr=Input.drag;Input.drag=[0,0];if(Input.mouse){this.tx=Input.mx;this.ty=Input.my}else{this.tx+=dr[0];this.ty+=dr[1]}
  this.tx=clamp(this.tx,24,W-24);this.ty=clamp(this.ty,24,H-24);const ox=this.x,k=1-Math.exp(-26*dt);this.x=lerp(this.x,this.tx,k);this.y=lerp(this.y,this.ty,k);
  this.vx=lerp(this.vx,(this.x-ox)/Math.max(dt,1e-4),1-Math.exp(-10*dt));const dir=clamp(this.vx/600,-1,1),st=Math.abs(dir);
  this.rot=lerpAng(this.rot,dir*.5,1-Math.exp(-12*dt));this.flapT+=dt*(10+st*28);this.flap=Math.sin(this.flapT)*(.25+st*.5)}}
function drawCube(c,x,y,rot,flap,col,alpha,img){c.save();c.translate(x,y);c.rotate(rot);c.globalAlpha=alpha;
 if(col){c.strokeStyle=col;c.lineWidth=5;c.beginPath();c.arc(0,0,38,0,TAU);c.stroke()}
 for(const s of[-1,1]){c.save();c.translate(s*20,0);c.rotate((s<0?1:-1)*flap);c.scale(s,1);c.globalAlpha=alpha*.9;const k=56/IM.wing.width;c.drawImage(IM.wing,0,-IM.wing.height*k/2,56,IM.wing.height*k);c.restore()}
 c.drawImage(img||IM.player,-24,-24,48,48);c.restore()}
class Proj{constructor(x,y,vx,vy){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.age=0;this.active=true;this.entered=false;this.R=12}
 update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.age+=dt;const i=this.x>=0&&this.x<=W&&this.y>=0&&this.y<=H;
  if(i)this.entered=true;else if(this.entered&&!(this.x>=-12&&this.x<=W+12&&this.y>=-12&&this.y<=H+12))this.active=false;else if(this.age>14)this.active=false}
 draw(c){drawGlow(c,"255,128,26",.85,this.x,this.y,70*(1+.12*Math.sin(this.age*30)));c.save();c.translate(this.x,this.y);c.rotate(Math.atan2(this.vy,this.vx));c.drawImage(IM.proj,-24,-24,48,48);c.restore()}}
class Laser{constructor(x,y,dx,dy,warn,fire){Object.assign(this,{x,y,dx,dy,warn,fireT:fire,t:0,state:0,bf:0,pulse:0,done:false});this.len=Math.hypot(W,H)*1.3+200;
  let tx=Infinity,ty=Infinity;if(dx>1e-4)tx=(W-x)/dx;else if(dx<-1e-4)tx=-x/dx;if(dy>1e-4)ty=(H-y)/dy;else if(dy<-1e-4)ty=-y/dy;
  let d=Math.min(tx,ty);if(!isFinite(d)||d<0)d=0;this.ex=x+dx*d;this.ey=y+dy*d;const m=60;this.sx=clamp(x,m,W-m);this.sy=clamp(y,m,H-m);this.tx=clamp(this.ex,m,W-m);this.ty=clamp(this.ey,m,H-m)}

  else{const f=this.t-this.warn;this.bf=clamp(f/.15,0,1);if(f>this.fireT-.4)this.bf=clamp((this.fireT-f)/.4,0,1);if(f>=this.fireT)this.done=true}}

  if(this.state===0){const p=this.pulse,a=.35+.45*p;c.save();c.beginPath();c.moveTo(this.x,this.y);c.lineTo(this.ex,this.ey);c.strokeStyle=`rgba(255,38,38,${.1+.1*p})`;c.lineWidth=46;c.stroke();
   c.setLineDash([24,24]);c.strokeStyle=`rgba(255,90,77,${Math.min(1,a+.2)})`;c.lineWidth=6;c.stroke();c.restore();
   drawGlow(c,"255,38,38",.45+.4*p,this.sx,this.sy,175);drawGlow(c,"255,140,26",.45+.4*(1-p),this.tx,this.ty,175);
   c.save();c.globalAlpha=.75+.25*p;const s1=92*(1+.16*p);c.drawImage(IM.warn,this.sx-s1/2,this.sy-s1/2,s1,s1);c.restore();
   c.save();c.translate(this.tx,this.ty);c.rotate(this.t*2);c.globalAlpha=.75+.25*(1-p);const s2=92*(1+.16*(1-p));c.drawImage(IM.target,-s2/2,-s2/2,s2,s2);c.restore();
   this.tag(c,"SALE",this.sx,this.sy,"#ff5a4d");this.tag(c,"LLEGA",this.tx,this.ty,"#ffb333")}
  else{const th=46*this.bf*(1+.08*Math.sin(this.t*45));c.save();c.translate(this.x,this.y);c.rotate(ang);c.globalAlpha=.4+.6*this.bf;c.drawImage(IM.laser,0,-th/2,this.len,th);c.restore();
   drawGlow(c,"255,77,77",.9*this.bf,this.x,this.y,110);drawGlow(c,"255,102,77",.8*this.bf,this.ex,this.ey,90)}}}

const COLS=["#4aa3ff","#4ade80","#ffd93d","#ff8bd0"];
class Game{constructor(d){this.extreme=d.mode===1;this.order=d.order;this.t=0;this.acc=0;this.cd=3;this.phase="cd";this.lastCount=99;
  this.rp=new RNG(mulberry32(d.seed));this.rl=new RNG(mulberry32((d.seed+7919)|0));this.spawnCd=1;this.laserCd=4;
  this.proj=[];this.lasers=[];this.fx=[];this.shake=0;this.alive=true;this.over=false;this.dead={};this.names={};this.sendT=0;this.seq=0;
  const offs=[[-140,0],[140,0],[0,-140],[0,140]];this.idx=d.order.indexOf(me.id);const o=offs[this.idx%4];this.p=new Player(W/2+o[0],H/2+o[1]);
  this.remotes={};d.order.forEach((id,i)=>{this.names[id]=nameOf(id);if(id===me.id)return;const o2=offs[i%4],x=W/2+o2[0],y=H/2+o2[1];
   this.remotes[id]={x,y,tx:x,ty:y,vx:0,vy:0,rot:0,trot:0,alive:true,col:COLS[i%4],seq:-1,at:performance.now()}});this.me=COLS[this.idx%4];this.board()}
 speed(){const s=300+this.t*12;return this.extreme?Math.min(s*1.5,1700):Math.min(s,1300)}
 interval(){const i=1.2-this.t*.006;return this.extreme?Math.max(.32,i*.7):Math.max(.55,i)}
 board(){$("#board").innerHTML=this.order.map(id=>{const a=this.dead[id]===undefined;return`<div style="color:${a?"#b3ffb3":"#ff7366"}">${esc(this.names[id])}${a?"":" ✕"}</div>`}).join("")}
 boom(x,y){for(let i=0;i<40;i++){const a=Math.random()*TAU,v=100+Math.random()*480;this.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+Math.random()*.6,m:1,s:8+Math.random()*14,c:["#ff8c1e","#ffd246","#fff","#ff461e"][i%4]})}this.shake=.5}
 step(dt){this.t+=dt;this.spawnCd-=dt;
  if(this.spawnCd<=0){this.spawnProj();const dbl=this.rp.r();if(this.t>(this.extreme?15:40)&&dbl<(this.extreme?.12:.08))this.spawnProj();this.spawnCd=this.interval()*this.rp.range(.7,1.3)}
  if(this.t>(this.extreme?6:12)){this.laserCd-=dt;if(this.laserCd<=0){this.spawnLaser();const b=this.extreme?Math.max(2,4-this.t*.03):Math.max(2.5,6-this.t*.03);this.laserCd=b*this.rl.range(.8,1.2)}}
  for(const q of this.proj)q.update(dt);for(const l of this.lasers)l.update(dt);this.proj=this.proj.filter(q=>q.active);this.lasers=this.lasers.filter(l=>!l.done)}
 spawnProj(){const m=60,r=this.rp,side=r.int(4),u=r.r(),ax=r.range(.1,.9),ay=r.range(.1,.9),sf=r.range(.88,1.12);let x,y;
  if(side===0){x=u*W;y=-m}else if(side===1){x=W+m;y=u*H}else if(side===2){x=u*W;y=H+m}else{x=-m;y=u*H}
  const tx=ax*W,ty=ay*H,d=Math.hypot(tx-x,ty-y)||1,sp=this.speed()*sf;this.proj.push(new Proj(x,y,(tx-x)/d*sp,(ty-y)/d*sp))}
 spawnLaser(){const m=90,r=this.rl,side=r.int(4),u=r.r(),ax=r.range(.15,.85),ay=r.range(.15,.85);let x,y;
  if(side===0){x=lerp(m,W-m,u);y=0}else if(side===1){x=W;y=lerp(m,H-m,u)}else if(side===2){x=lerp(m,W-m,u);y=H}else{x=0;y=lerp(m,H-m,u)}
  const tx=ax*W,ty=ay*H,d=Math.hypot(tx-x,ty-y)||1;this.lasers.push(new Laser(x,y,(tx-x)/d,(ty-y)/d,this.extreme?1:1.2,4))}
 die(){if(!this.alive)return;this.alive=false;this.dead[me.id]=this.t;$("#chatb").classList.add("dead");this.boom(this.p.x,this.p.y);this.board();$("#cd").style.fontSize="40px";$("#cd").textContent="¡Estás eliminado!\nToca 💬 para chatear";
  if(isHost)markDead(me.id,this.t);else send(hostC,{t:"dead",time:this.t})}
 update(dt){const p=this.p;if(this.shake>0)this.shake=Math.max(0,this.shake-dt*1.5);
  for(let i=this.fx.length-1;i>=0;i--){const f=this.fx[i];f.l-=dt;if(f.l<=0){this.fx.splice(i,1);continue}f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.97;f.vy*=.97}
  if(this.alive)p.update(dt);
  for(const r of Object.values(this.remotes)){if(!r.alive)continue;const age=Math.min(.1,(performance.now()-r.at)/1000),k=1-Math.exp(-22*dt); // interpolación + predicción corta
   r.x=lerp(r.x,r.tx+r.vx*age,k);r.y=lerp(r.y,r.ty+r.vy*age,k);r.rot=lerpAng(r.rot,r.trot,1-Math.exp(-12*dt))}
  this.sendT-=dt;if(this.alive&&this.sendT<=0){this.sendT=1/30;const m={t:"p",x:Math.round(p.x),y:Math.round(p.y),r:+p.rot.toFixed(2),n:++this.seq};
   if(isHost){m.id=me.id;for(const k in pconns)send(pconns[k],m)}else send(hostP,m)}

  if(this.phase==="cd"){this.cd-=dt;const n=Math.ceil(this.cd);if(n!==this.lastCount&&n>0){this.lastCount=n;$("#cd").style.fontSize="72px";$("#cd").textContent=n}

 draw(){const c=ctx;c.save();if(this.shake>0)c.translate((Math.random()*2-1)*this.shake*18,(Math.random()*2-1)*this.shake*18);
  c.drawImage(IM.bg,-30,-30,780,1344);
  for(const q of this.proj)q.draw(c);
  for(const f of this.fx){c.globalAlpha=clamp(f.l,0,1);c.fillStyle=f.c;c.fillRect(f.x-f.s/2,f.y-f.s/2,f.s,f.s)}c.globalAlpha=1;
  for(const id in this.remotes){const r=this.remotes[id];if(!r.alive)continue;drawCube(c,r.x,r.y,r.rot,Math.sin(performance.now()/60)*.3,r.col,.95,skinTex(skinOf(id)));
   c.save();c.font="900 22px Nunito,sans-serif";c.textAlign="center";c.textBaseline="middle";c.lineJoin="round";c.lineWidth=6;c.strokeStyle="rgba(0,0,0,.9)";c.strokeText(this.names[id],r.x,r.y-50);c.fillStyle="#fff";c.fillText(this.names[id],r.x,r.y-50);c.restore()}
  if(this.alive)drawCube(c,this.p.x,this.p.y,this.p.rot,this.p.flap,this.me,1,skinTex(skinOf(me.id)));
  for(const l of this.lasers)l.draw(c);c.restore();
  c.save();c.font="900 28px Nunito,sans-serif";c.fillStyle="#fff";c.strokeStyle="#000";c.lineWidth=5;c.lineJoin="round";const tx=fmt(this.phase==="play"?this.t:0);c.strokeText(tx,24,44);c.fillText(tx,24,44);c.restore()}}
function applyPos(id,d){if(!G)return;const r=G.remotes[id];if(!r||!r.alive||d.n<r.seq)return;r.seq=d.n;const now=performance.now(),dt=(now-r.at)/1000;
 if(dt>.005&&dt<.5){r.vx=lerp(r.vx,clamp((d.x-r.tx)/dt,-4000,4000),.5);r.vy=lerp(r.vy,clamp((d.y-r.ty)/dt,-4000,4000),.5)}r.tx=d.x;r.ty=d.y;r.trot=d.r;r.at=now}
function markDead(id,time){if(!G||G.dead[id]!==undefined)return;G.dead[id]=time;const r=G.remotes[id];if(r&&r.alive){r.alive=false;G.boom(r.x,r.y)}G.board();
 if(isHost){broadcast({t:"dead",id,time},id);checkEnd()}}
function checkEnd(){if(!G||G.over)return;const alive=G.order.filter(id=>G.dead[id]===undefined);if(alive.length>1)return;G.over=true;const g=G;
 const rows=g.order.map(id=>({id,name:g.names[id],time:g.dead[id]!==undefined?g.dead[id]:g.t,alive:g.dead[id]===undefined})).sort((a,b)=>(b.alive-a.alive)||(b.time-a.time));
 setTimeout(()=>{if(G!==g)return;state="end";roster.forEach(r=>r.ready=false);broadcast({t:"end",rows});showEnd(rows);sendRoster()},1000)}
function startGame(d){state="playing";endRows=null;$("#end").classList.remove("on");if(!d.order.includes(me.id)){toast("Partida en curso, espera la siguiente");return}
 G=new Game(d);chatClear();show("game");$("#cd").textContent="";cv.style.display="block"}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(G){G.update(dt);G.draw()}requestAnimationFrame(loop)}

/* ---------- Pantalla final: resultados + todos los conectados + volver a jugar / menú ---------- */
function showEnd(rows){endRows=rows;$("#end").classList.add("on");$("#cd").textContent="";renderEnd()}
function renderEnd(){const el=$("#end");if(!endRows||!el.classList.contains("on")||state==="playing")return;
 const m=roster.find(r=>r.id===me.id)||{},top=endRows[0],ready=roster.filter(r=>r.ready).length;
 const title=!top.alive?"NADIE SOBREVIVIÓ":top.id===me.id?"¡GANASTE!":"GANÓ "+esc(top.name).toUpperCase();
 el.innerHTML=`<div class="h2 ${top.id===me.id&&top.alive?"gold":"red"}">${title}</div>
 <div class="box">${endRows.map((r,i)=>`<div class="lrow ${r.id===me.id?"me":""}"><span>${i+1}. ${esc(r.name)}</span><span>${fmt(r.time)}</span></div>`).join("")}</div>
 <div class="px">CONECTADOS (${roster.length})</div>
 <div class="box">${roster.map(r=>`<div class="lrow ${r.id===me.id?"me":""}"><span>${esc(r.name)}${r.id===me.id?" (tú)":""}${r.id===hostId?" ★":""}</span><span class="tag ${r.ready?"ok":""}">${r.ready?"LISTO":"EN ESPERA"}</span></div>`).join("")}</div>
 <button class="btn green" data-a="again">${m.ready?"LISTO · ESPERANDO… (toca para cancelar)":"VOLVER A JUGAR"}</button>
 ${isHost&&m.ready&&ready>=2?'<button class="btn" data-a="start">INICIAR AHORA ('+ready+' listos)</button>':""}
 <button class="btn red" data-a="menu">VOLVER A ONLINE</button>`}

/* ---------- Botones ---------- */
let chip=0;
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="login")login();else if(a==="m0"||a==="m1"){chip=a==="m1"?1:0;mode=chip;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.a===a))}
 else if(a==="create"){mode=chip;createRoom()}
 else if(a==="join"){const c=$("#code").value.trim();if(!/^\d{4}$/.test(c))return toast("El código tiene 4 números");toast("Entrando…",6000);joinRoom(c)}
 else if(a==="start")hostStart();
 else if(a==="menu")leaveAll();
 else if(a==="again"){const m=roster.find(r=>r.id===me.id);if(!m)return;const v=!m.ready;if(isHost){m.ready=v;sendRoster()}else{m.ready=v;send(hostC,{t:"again",v});renderEnd()}}
 else if(a==="logout"){try{localStorage.removeItem(ACC_K)}catch(e){}$("#p").value="";show("login")}else if(a==="chat")toggleChat();else if(a==="send")sendChat();else if(a==="sk")setSkin(b.dataset.c||"");
  else if(a==="quit"){if(confirm("¿Salir de la partida?"))leaveAll()}});
imgReady.then(()=>{buildTex();renderSkins();requestAnimationFrame(loop);autoLogin()});
</script></body></html>
